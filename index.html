<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSearch</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: #0a0014;
    color: white;
}

/* HEADER */
.header {
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 2.5em;
    color: #00d4ff;
}

.fav-count {
    font-size: 0.6em;
    color: #ff4081;
}

/* SEARCH */
.search-section {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    position: relative;
}

#artist {
    width: 300px;
    padding: 12px;
    border-radius: 25px;
    border: none;
    background: #1a003d;
    color: white;
}

button {
    padding: 12px 20px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
}

.search-btn {
    background: #7c3aed;
    color: white;
}

.fav-btn-top {
    background: #ff4081;
    color: white;
}

/* RESULTS GRID */
#results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* CARD */
.artist-card {
    background: #1a003d;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
}

.artist-card:hover {
    transform: translateY(-5px);
}

.card-img-wrapper {
    position: relative;
}

.card-img-wrapper img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:0.3s;
    font-size: 2em;
}

.artist-card:hover .overlay {
    opacity:1;
}

/* INFO */
.card-info {
    padding: 10px;
}

.card-info h3 {
    color: #00d4ff;
}

.card-actions {
    display:flex;
    justify-content: space-between;
    padding: 10px;
}

.spotify-btn {
    background:#1DB954;
    color:white;
}

/* AUTOCOMPLETE */
#autocomplete-box {
    position:absolute;
    top:60px;
    background:#1a003d;
    width:300px;
    border-radius:10px;
    overflow:hidden;
}

.auto-item {
    padding:10px;
    cursor:pointer;
}

.auto-item:hover {
    background:#7c3aed;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
}

.modal-content {
    background:#1a003d;
    margin:10% auto;
    padding:20px;
    width:90%;
    max-width:500px;
    border-radius:10px;
}

.close-btn {
    float:right;
    cursor:pointer;
}

/* ANIMATION */
.animate {
    animation: fadeUp 0.4s ease;
}

@keyframes fadeUp {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="header">
    <h1>🎵 VibeSearch <span id="fav-count" class="fav-count">0</span></h1>
</div>

<div class="search-section">
    <input id="artist" placeholder="Search artists...">
    <button class="search-btn" onclick="search()">Search</button>
    <button class="fav-btn-top" onclick="openFavoritesPage()">❤️</button>
</div>

<div id="results"></div>

<!-- MODAL -->
<div id="artist-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modal-name"></h2>
        <p id="modal-bio"></p>
    </div>
</div>

<!-- LINK YOUR JS FILE -->
<script src="app.js"></script>

</body>
</html>
