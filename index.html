<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSearch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 VibeSearch</h1>
        <p>Find artists similar to your favorites</p>
        
        <div class="search-box">
            <input type="text" id="artist-input" class="search-input" placeholder="Enter artist name...">
            <button id="search-button" class="search-button">Search</button>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        let accessToken = null;
        const CLIENT_ID = 'a6e75f0234ca4d59a35edb0e60f8a3c3';
        const CLIENT_SECRET = '33d8a8ee2d714db897a7a34fe77dd27c';

        // Get Spotify token
        async function getToken() {
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
                    },
                    body: 'grant_type=client_credentials'
                });
                
                const data = await response.json();
                accessToken = data.access_token;
            } catch (error) {
                console.error('Token error:', error);
            }
        }

        async function handleSearch() {
            const artistName = document.getElementById('artist-input').value.trim();
            
            if (!artistName) {
                alert('Please enter an artist name');
                return;
            }
            
            if (!accessToken) {
                await getToken();
            }
            
            document.getElementById('results').innerHTML = '<p>Loading...</p>';
            
            try {
                // Search for artist
                const searchResponse = await fetch(
                    `https://api.spotify.com/v1/search?q=${encodeURIComponent(artistName)}&type=artist&limit=1`,
                    { headers: { 'Authorization': `Bearer ${accessToken}` } }
                );
                const searchData = await searchResponse.json();
                
                if (!searchData.artists.items.length) {
                    document.getElementById('results').innerHTML = '<p>Artist not found</p>';
                    return;
                }
                
                const artistId = searchData.artists.items[0].id;
                
                // Get related artists
                const relatedResponse = await fetch(
                    `https://api.spotify.com/v1/artists/${artistId}/related-artists`,
                    { headers: { 'Authorization': `Bearer ${accessToken}` } }
                );
                const relatedData = await relatedResponse.json();
                
                displayResults(relatedData.artists);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = '<p>Error fetching data</p>';
            }
        }
        
        function displayResults(artists) {
            let html = '';
            artists.slice(0, 12).forEach(artist => {
                const img = artist.images[0] ? artist.images[0].url : 'https://via.placeholder.com/150?text=No+Image';
                html += `
                    <div class="artist-card" onclick="search('${artist.name.replace(/'/g, "\\'")}')">
                        <img src="${img}" alt="${artist.name}" style="width:100%; height:150px; object-fit:cover; border-radius:5px; margin-bottom:10px;">
                        <h3>${artist.name}</h3>
                    </div>
                `;
            });
            document.getElementById('results').innerHTML = html;
        }
        
        function search(artistName) {
            document.getElementById('artist-input').value = artistName;
            handleSearch();
        }
        
        // Initialize
        document.getElementById('search-button').addEventListener('click', handleSearch);
        document.getElementById('artist-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        
        get`
