<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSearch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 VibeSearch</h1>
        <p>Find artists similar to your favorites</p>
        
        <div class="search-box">
            <input type="text" id="artist-input" class="search-input" placeholder="Enter artist name...">
            <button id="search-button" class="search-button">Search</button>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        const API_KEY = '3bd4b23b8db71c70de8380ebc7f4bccb';
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        
        function handleSearch() {
            const artistName = document.getElementById('artist-input').value.trim();
            
            if (!artistName) {
                alert('Please enter an artist name');
                return;
            }
            
            document.getElementById('results').innerHTML = '<p>Loading...</p>';
            
            const lastfmUrl = `https://ws.audioscrobbler.com/2.0/?method=artist.getsimilar&artist=${encodeURIComponent(artistName)}&api_key=${API_KEY}&format=json`;
            const url = CORS_PROXY + encodeURIComponent(lastfmUrl);
            
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    const jsonData = JSON.parse(data);
                    
                    if (jsonData.error) {
                        document.getElementById('results').innerHTML = '<p>Artist not found. Try another name.</p>';
                        return;
                    }
                    
                    if (!jsonData.similarartists || !jsonData.similarartists.artist) {
                        document.getElementById('results').innerHTML = '<p>No similar artists found.</p>';
                        return;
                    }
                    
                    const artists = jsonData.similarartists.artist;
                    displayResults(artists);
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('results').innerHTML = '<p>Error fetching data. Please try again.</p>';
                });
        }
        
        function displayResults(artists) {
            let html = '';
            artists.slice(0, 12).forEach(artist => {
                const img = artist.image && artist.image[2] ? artist.image[2]['#text'] : 'https://via.placeholder.com/150?text=No+Image';
                const match = Math.round(artist.match * 100);
                html += `
                    <div class="artist-card" onclick="search('${artist.name.replace(/'/g, "\\'")}')">
                        <img src="${img}" alt="${artist.name}" style="width:100%; height:150px; object-fit:cover; border-radius:5px; margin-bottom:10px;" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        <h3>${artist.name}</h3>
                        <p>${match}% match</p>
                    </div>
                `;
            });
            document.getElementById('results').innerHTML = html;
        }
        
        function search(artistName) {
            document.getElementById('artist-input').value = artistName;
            handleSearch();
        }
        
        document.getElementById('search-button').addEventListener('click', handleSearch);
        document.getElementById('artist-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
