<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSearch - Find Similar Artists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 VibeSearch</h1>
        <p>Discover artists similar to your favorites</p>
        
        <div class="search-box">
            <input type="text" id="artistInput" class="search-input" placeholder="Enter an artist name...">
            <button id="searchBtn" class="search-button">Search</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        const API_KEY = 'YOUR_LASTFM_API_KEY';
        const CORS_URL = 'https://cors-anywhere.herokuapp.com/';

        document.getElementById('searchBtn').addEventListener('click', searchArtist);
        document.getElementById('artistInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchArtist();
        });

        async function searchArtist() {
            const artistName = document.getElementById('artistInput').value.trim();
            
            if (!artistName) {
                alert('Please enter an artist name');
                return;
            }

            document.getElementById('results').innerHTML = '<p style="text-align: center; color: white;">Loading...</p>';

            try {
                const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getsimilar&artist=${encodeURIComponent(artistName)}&api_key=${API_KEY}&format=json`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('results').innerHTML = '<p style="text-align: center; color: #ff6b6b;">Artist not found. Try again!</p>';
                    return;
                }

                if (!data.similarartists || !data.similarartists.artist) {
                    document.getElementById('results').innerHTML = '<p style="text-align: center; color: #ff6b6b;">No similar artists found</p>';
                    return;
                }

                displayArtists(data.similarartists.artist);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = '<p style="text-align: center; color: #ff6b6b;">Error fetching data</p>';
            }
        }

        function displayArtists(artists) {
            let html = '';
            artists.slice(0, 12).forEach(artist => {
                const img = artist.image && artist.image[2] ? artist.image[2]['#text'] : 'https://via.placeholder.com/150?text=No+Image';
                const match = Math.round(artist.match * 100);
                
                html += `
                    <div class="artist-card" onclick="document.getElementById('artistInput').value='${artist.name.replace(/'/g, "\\'")}'; searchArtist();">
                        <img src="${img}" alt="${artist.name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        <h3>${artist.name}</h3>
                        <p style="color: #b0b0ff;">${match}% match</p>
                    </div>
                `;
            });

            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>
</html>
